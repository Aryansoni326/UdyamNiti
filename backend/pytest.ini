[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *TestCase
python_functions = test_*
addopts = --tb=short -ra -v
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
markers =
    unit: Unit level tests
    integration: Integration and multi-component tests
    e2e: End-to-end golden path tests
    security: Security, isolation, and prompt-injection tests
    observability: Telemetry, health, and latency tests
