services:
  # ─── 1. PostgreSQL with pgvector Extension ──────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: udyamniti_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-udyamniti}
      POSTGRES_USER: ${POSTGRES_USER:-udyamniti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udyamniti_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - udyamniti_net
    restart: unless-stopped

  # ─── 2. Redis Cache & Celery Message Broker ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: udyamniti_redis
    ports:
      - "6380:6379"
    networks:
      - udyamniti_net
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ─── 3. Django REST API Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: udyamniti_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-udyamniti}:${POSTGRES_PASSWORD:-udyamniti_secret}@db:5432/${POSTGRES_DB:-udyamniti}
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-hackathon-dev-secret-key-udyamniti-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      USE_S3: ${USE_S3:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./backend:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    networks:
      - udyamniti_net
    depends_on:
      - db
      - redis
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped

  # ─── 4. Celery Asynchronous Background Worker ───────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: udyamniti_celery
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-udyamniti}:${POSTGRES_PASSWORD:-udyamniti_secret}@db:5432/${POSTGRES_DB:-udyamniti}
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-hackathon-dev-secret-key-udyamniti-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./backend:/app
      - media_files:/app/media
    networks:
      - udyamniti_net
    depends_on:
      - db
      - redis
    command: celery -A config worker -l info
    restart: unless-stopped

  # ─── 5. React + Vite Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: udyamniti_frontend
    environment:
      VITE_API_BASE_URL: http://backend:8000
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    networks:
      - udyamniti_net
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

networks:
  udyamniti_net:
    name: udyamniti_net
    driver: bridge

volumes:
  pgdata:
    name: udyamniti_pgdata
  redisdata:
    name: udyamniti_redisdata
  media_files:
    name: udyamniti_media_files
